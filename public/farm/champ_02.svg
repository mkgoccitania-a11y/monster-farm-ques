<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Pousses">
  <defs>
    <linearGradient id="soil02" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a16830"/>
      <stop offset="0.55" stop-color="#7e4b22"/>
      <stop offset="1" stop-color="#5b3314"/>
    </linearGradient>
    <symbol id="sprout02" viewBox="0 0 14 14">
