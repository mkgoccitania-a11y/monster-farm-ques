  <!-- Bordure planche de bois -->
  <rect x="0" y="0" width="100" height="100" rx="6" fill="none" stroke="#3a2210" stroke-width="3"/>
  <rect x="1.6" y="1.6" width="96.8" height="96.8" rx="5" fill="none" stroke="#c98a45" stroke-width="0.8" opacity="0.55"/>
