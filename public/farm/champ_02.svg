  <use href="#sprout02" x="49" y="11" width="11" height="11"/>
  <use href="#sprout02" x="69" y="11" width="11" height="11"/>

  <use href="#sprout02" x="19" y="33" width="11" height="11"/>
  <use href="#sprout02" x="39" y="33" width="11" height="11"/>
  <use href="#sprout02" x="59" y="33" width="11" height="11"/>
  <use href="#sprout02" x="79" y="33" width="11" height="11"/>

  <use href="#sprout02" x="9" y="55" width="11" height="11"/>
