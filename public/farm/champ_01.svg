<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sol labouré">
  <defs>
    <linearGradient id="soil01" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a16830"/>
      <stop offset="0.55" stop-color="#7e4b22"/>
      <stop offset="1" stop-color="#5b3314"/>
    </linearGradient>
  </defs>

  <!-- Fond brun terre, remplit toute la tuile -->
  <rect width="100" height="100" fill="url(#soil01)"/>

  <!-- Sillons sombres (rangées labourées) -->
  <g stroke="#3a2210" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M8 2 C6 50 6 98 8 98" stroke-width="2.8"/>
    <path d="M20 2 C18 50 18 98 20 98" stroke-width="2.8"/>
    <path d="M32 2 C30 50 30 98 32 98" stroke-width="2.8"/>
    <path d="M44 2 C42 50 42 98 44 98" stroke-width="2.8"/>
    <path d="M56 2 C54 50 54 98 56 98" stroke-width="2.8"/>
    <path d="M68 2 C66 50 66 98 68 98" stroke-width="2.8"/>
    <path d="M80 2 C78 50 78 98 80 98" stroke-width="2.8"/>
    <path d="M92 2 C90 50 90 98 92 98" stroke-width="2.8"/>
  </g>

  <!-- Crêtes éclairées entre les sillons -->
  <g stroke="#d09356" stroke-linecap="round" fill="none" opacity="0.45">
    <path d="M11 4 C9 50 9 96 11 96" stroke-width="1.2"/>
    <path d="M23 4 C21 50 21 96 23 96" stroke-width="1.2"/>
    <path d="M35 4 C33 50 33 96 35 96" stroke-width="1.2"/>
    <path d="M47 4 C45 50 45 96 47 96" stroke-width="1.2"/>
    <path d="M59 4 C57 50 57 96 59 96" stroke-width="1.2"/>
    <path d="M71 4 C69 50 69 96 71 96" stroke-width="1.2"/>
    <path d="M83 4 C81 50 81 96 83 96" stroke-width="1.2"/>
    <path d="M95 4 C93 50 93 96 95 96" stroke-width="1.2"/>
  </g>

  <!-- Petits cailloux et mottes -->
  <g fill="#3a2210" opacity="0.55">
    <circle cx="15" cy="18" r="0.9"/>
    <circle cx="28" cy="42" r="1.3"/>
    <circle cx="55" cy="22" r="1"/>
    <circle cx="68" cy="78" r="1.2"/>
    <circle cx="40" cy="65" r="0.8"/>
    <circle cx="82" cy="35" r="1.1"/>
    <circle cx="19" cy="73" r="1.4"/>
    <circle cx="76" cy="58" r="0.7"/>
    <circle cx="50" cy="48" r="1.1"/>
    <circle cx="88" cy="88" r="0.9"/>
    <circle cx="25" cy="88" r="1.1"/>
    <circle cx="62" cy="12" r="0.8"/>
    <circle cx="92" cy="55" r="1"/>
  </g>
  <g fill="#e0a261" opacity="0.5">
    <circle cx="12" cy="38" r="0.5"/>
    <circle cx="36" cy="20" r="0.6"/>
    <circle cx="62" cy="55" r="0.6"/>
    <circle cx="78" cy="14" r="0.5"/>
    <circle cx="44" cy="86" r="0.6"/>
    <circle cx="86" cy="68" r="0.5"/>
    <circle cx="20" cy="55" r="0.4"/>
  </g>

  <!-- Bordure planche de bois -->
  <rect x="0" y="0" width="100" height="100" rx="6" fill="none" stroke="#3a2210" stroke-width="3"/>
  <rect x="1.6" y="1.6" width="96.8" height="96.8" rx="5" fill="none" stroke="#c98a45" stroke-width="0.8" opacity="0.55"/>
</svg>
