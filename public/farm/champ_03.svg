<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Champ mûr">
  <defs>
    <linearGradient id="soil03" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a16830"/>
      <stop offset="0.55" stop-color="#7e4b22"/>
      <stop offset="1" stop-color="#5b3314"/>
    </linearGradient>
    <symbol id="wheat03" viewBox="0 0 14 22">
      <!-- Tige -->
      <path d="M7 21 V8" stroke="#7d6210" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Feuilles -->
      <path d="M7 14 C3 13 1.5 14.5 1 17 C4 17.5 6 16 7 14 Z" fill="#8b9b1f"/>
      <path d="M7 12 C11 11 12.5 12.5 13 15 C10 15.5 8 14 7 12 Z" fill="#a4b525"/>
      <!-- Épi : grains dorés -->
      <g fill="#ffce2a" stroke="#9d6a05" stroke-width="0.3">
        <ellipse cx="7" cy="3.5" rx="1.7" ry="3.2"/>
        <ellipse cx="4.6" cy="5.6" rx="1.3" ry="2.5" transform="rotate(-35 4.6 5.6)"/>
        <ellipse cx="9.4" cy="5.6" rx="1.3" ry="2.5" transform="rotate(35 9.4 5.6)"/>
        <ellipse cx="4.2" cy="8.4" rx="1.3" ry="2.5" transform="rotate(-38 4.2 8.4)"/>
        <ellipse cx="9.8" cy="8.4" rx="1.3" ry="2.5" transform="rotate(38 9.8 8.4)"/>
      </g>
      <!-- Reflet sur l'épi -->
      <path d="M7 1 V7" stroke="#fff4a6" stroke-width="0.4" opacity="0.7"/>
    </symbol>
  </defs>

  <!-- Fond brun + sillons -->
  <rect width="100" height="100" fill="url(#soil03)"/>

  <g stroke="#3a2210" stroke-linecap="round" fill="none" opacity="0.45">
    <path d="M8 2 C6 50 6 98 8 98" stroke-width="2.4"/>
    <path d="M20 2 C18 50 18 98 20 98" stroke-width="2.4"/>
    <path d="M32 2 C30 50 30 98 32 98" stroke-width="2.4"/>
    <path d="M44 2 C42 50 42 98 44 98" stroke-width="2.4"/>
    <path d="M56 2 C54 50 54 98 56 98" stroke-width="2.4"/>
    <path d="M68 2 C66 50 66 98 68 98" stroke-width="2.4"/>
    <path d="M80 2 C78 50 78 98 80 98" stroke-width="2.4"/>
    <path d="M92 2 C90 50 90 98 92 98" stroke-width="2.4"/>
  </g>

  <!-- 4 rangées × 4 épis (dense champ doré) -->
  <use href="#wheat03" x="6" y="6" width="13" height="20"/>
  <use href="#wheat03" x="26" y="6" width="13" height="20"/>
  <use href="#wheat03" x="46" y="6" width="13" height="20"/>
  <use href="#wheat03" x="66" y="6" width="13" height="20"/>
  <use href="#wheat03" x="82" y="6" width="13" height="20"/>

  <use href="#wheat03" x="16" y="28" width="13" height="20"/>
  <use href="#wheat03" x="36" y="28" width="13" height="20"/>
  <use href="#wheat03" x="56" y="28" width="13" height="20"/>
  <use href="#wheat03" x="76" y="28" width="13" height="20"/>

  <use href="#wheat03" x="6" y="50" width="13" height="20"/>
  <use href="#wheat03" x="26" y="50" width="13" height="20"/>
  <use href="#wheat03" x="46" y="50" width="13" height="20"/>
  <use href="#wheat03" x="66" y="50" width="13" height="20"/>
  <use href="#wheat03" x="82" y="50" width="13" height="20"/>

  <use href="#wheat03" x="16" y="72" width="13" height="20"/>
  <use href="#wheat03" x="36" y="72" width="13" height="20"/>
  <use href="#wheat03" x="56" y="72" width="13" height="20"/>
  <use href="#wheat03" x="76" y="72" width="13" height="20"/>

  <!-- Petits éclats dorés ambiants -->
  <g fill="#ffe066" opacity="0.4">
    <circle cx="11" cy="42" r="0.6"/>
    <circle cx="44" cy="22" r="0.5"/>
    <circle cx="72" cy="62" r="0.6"/>
    <circle cx="90" cy="80" r="0.5"/>
  </g>

  <!-- Bordure planche de bois -->
  <rect x="0" y="0" width="100" height="100" rx="6" fill="none" stroke="#3a2210" stroke-width="3"/>
  <rect x="1.6" y="1.6" width="96.8" height="96.8" rx="5" fill="none" stroke="#c98a45" stroke-width="0.8" opacity="0.55"/>
</svg>
